name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  # Creates a project with giode new and builds it for every target the
  # runner can, checking that giode.toml's additions reach the Android
  # manifest and the Info.plist.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install Gio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev \
            nsis osslsigncode
      - name: Install the CLI
        run: go install ./cmd/giode
      - name: Create a project
        working-directory: ${{ runner.temp }}
        run: |
          giode new -id org.giode.demo -no-git demo
          cat >> demo/giode.toml <<'TOML'

          [ios.usage]
          camera = "To attach photos."
          TOML
          sed -i 's/^# keep_alive = true.*/keep_alive = true/; s/^# permissions = .*/permissions = ["network", "camera"]/' demo/giode.toml
          cat demo/giode.toml
      - name: Doctor
        working-directory: ${{ runner.temp }}/demo
        run: giode doctor
      - name: Build
        working-directory: ${{ runner.temp }}/demo
        run: giode build -x android windows linux web
      - name: Build a signed Windows installer
        working-directory: ${{ runner.temp }}/demo
        env:
          GIODE_WINDOWS_CERT_PASS: ci-test-password
        run: |
          giode cert
          giode build -x -release windows-installer
          for f in dist/windows/Demo.exe dist/windows/Demo-0.1.0-setup.exe; do
            osslsigncode verify -in "$f" | tee verify.txt
            grep -q "Subject: /CN=Demo" verify.txt
            grep -q "Timestamp" verify.txt
          done
      - name: Check the Android manifest
        working-directory: ${{ runner.temp }}/demo
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt2" dump xmltree --file AndroidManifest.xml dist/android/Demo.apk | tee manifest.txt
          for want in org.giode.mobile.KeepAliveService FOREGROUND_SERVICE_DATA_SYNC POST_NOTIFICATIONS android.permission.CAMERA android.permission.INTERNET; do
            grep -q "$want" manifest.txt || { echo "manifest lacks $want"; exit 1; }
          done
      - name: Check the other outputs
        working-directory: ${{ runner.temp }}/demo
        run: |
          file dist/windows/Demo.exe | grep -q "PE32+"
          test -x dist/linux/demo
          test -f dist/linux/org.giode.demo.desktop
          test -f dist/web/main.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: demo-builds
          path: ${{ runner.temp }}/demo/dist
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install the CLI
        run: go install ./cmd/giode
      - name: Create a project
        working-directory: ${{ runner.temp }}
        run: |
          giode new -id org.giode.demo -no-git demo
          cat >> demo/giode.toml <<'TOML'

          [ios.usage]
          camera = "To attach photos."
          microphone = "To dictate."

          [ios.plist]
          ITSAppUsesNonExemptEncryption = false
          TOML
      - name: Build
        working-directory: ${{ runner.temp }}/demo
        run: giode build -x ios-sim macos
      - name: Check the Info.plist
        working-directory: ${{ runner.temp }}/demo
        run: |
          plutil -p dist/ios/Demo.app/Info.plist | tee plist.txt
          grep -q '"NSCameraUsageDescription" => "To attach photos."' plist.txt
          grep -q '"NSMicrophoneUsageDescription" => "To dictate."' plist.txt
          grep -q '"ITSAppUsesNonExemptEncryption" => false' plist.txt
          test -d dist/macos/Demo.app

  # Builds, signs, installs and uninstalls the Windows installer on
  # Windows, with NSIS and signtool from the runner image.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install the CLI
        run: go install ./cmd/giode
      - name: Create a project
        working-directory: ${{ runner.temp }}
        run: giode new -id org.giode.demo -no-git demo
      - name: Build a signed installer
        working-directory: ${{ runner.temp }}/demo
        env:
          GIODE_WINDOWS_CERT_PASS: ci-test-password
        run: |
          giode doctor
          giode cert
          giode build -x -release windows-installer
      - name: Check the signatures
        working-directory: ${{ runner.temp }}/demo
        shell: pwsh
        run: |
          foreach ($f in 'dist\windows\Demo.exe', 'dist\windows\Demo-0.1.0-setup.exe') {
            $s = Get-AuthenticodeSignature $f
            "$f : $($s.Status) $($s.SignerCertificate.Subject)"
            # Self-signed, so not trusted, but signed by our certificate.
            if ($s.SignerCertificate.Subject -ne 'CN=Demo') { exit 1 }
          }
      - name: Install, check and uninstall
        working-directory: ${{ runner.temp }}/demo
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath 'dist\windows\Demo-0.1.0-setup.exe' -ArgumentList '/S'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Demo'
          if (-not (Test-Path (Join-Path $dir 'Demo.exe'))) { throw 'Demo.exe not installed' }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\org.giode.demo'
          Get-ItemProperty $key | Format-List DisplayName, DisplayVersion, Publisher, UninstallString
          # _?= runs the uninstaller in place, so -Wait waits for it.
          Start-Process -Wait -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S', "_?=$dir"
          if (Test-Path $key) { throw 'uninstall entry left behind' }
